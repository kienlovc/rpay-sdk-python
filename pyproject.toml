[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rpay-sdk"
version = "1.0.0"
description = "Official RPAY Payment & Banking SDK for Python — VietQR, 15 Vietnamese Bank Gateways (POS/V1/V2/V3), Bank Invoices, 18-Network USDT/USDC Crypto Gateway, Multi-Domain & HMAC-SHA256 Webhooks."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [
  { name = "RPAY Team", email = "support@rpay.vn" }
]
keywords = [
  "rpay",
  "rpay-sdk",
  "vietqr",
  "sepay",
  "payment-gateway",
  "vietnam-bank-api",
  "vietcombank",
  "mbbank",
  "acb",
  "usdt",
  "usdc",
  "trc20",
  "bep20",
  "webhook",
  "hmac-sha256"
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial",
  "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = []

[project.urls]
Homepage = "https://rpay.vn"
Documentation = "https://rpay.vn/docs"
Repository = "https://github.com/rpayvn/rpay-sdk-python"

[tool.setuptools.packages.find]
where = ["."]
include = ["rpay_sdk*"]
